# Builds and tests every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --locked --release
      - run: cargo build --locked --release --features app
      - run: cargo test --locked --release
      - name: Check shell scripts
        run: bash -n installer.sh && bash -n scripts/setup-desktop.sh && python3 -m py_compile widget/archmates-widget

  # Winmates (Windows client) and the shared code on Windows.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --locked --release --features app
      - run: cargo test --locked --release
