# Builds and tests every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --locked --release
      - run: cargo build --locked --release --features app
      - run: cargo test --locked --release
      - name: Check shell scripts
        run: bash -n installer.sh && bash -n scripts/setup-desktop.sh && python3 -m py_compile widget/archmates-widget

  # Winmates (Windows client) and the shared code on Windows.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --locked --release --features app
      - run: cargo test --locked --release
      # Test build to try before a release: Actions → this run → Artifacts → "winmates-test".
      - name: Package Winmates (test build)
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          NAME="winmates-$VERSION-x86_64-windows"
          mkdir -p "dist/$NAME"
          cp target/release/winmates.exe target/release/archmates.exe README.md LICENSE "dist/$NAME/"
      - uses: actions/upload-artifact@v4
        with:
          name: winmates-test
          path: dist/
          retention-days: 14
