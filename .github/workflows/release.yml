# Publishes a GitHub release when a version tag (e.g. v0.2.0) is pushed.
# The release contains a ready-to-run Linux archive (also used by the AUR package and
# `archmates update --install`) and the Winmates archive for Windows (also used by
# Winmates' own update at startup).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --locked --release --features app
      # WinmatesSetup.exe embeds the three programs built just above.
      - name: Build WinmatesSetup.exe
        shell: pwsh
        run: |
          $env:WINMATES_PAYLOAD = "$PWD\target\release"
          cargo build --locked --release --features setup --bin winmates-setup
      - run: cargo test --locked --release
      - name: Package Winmates
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          NAME="winmates-$VERSION-x86_64-windows"
          mkdir -p "dist/$NAME"
          cp target/release/winmates.exe target/release/winmates-updater.exe target/release/archmates.exe README.md LICENSE "dist/$NAME/"
          cp target/release/winmates-setup.exe "dist/WinmatesSetup-$VERSION.exe"
          cd dist
          # The zip is what WinmatesUpdater downloads; the setup is what people download.
          7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          sha256sum "WinmatesSetup-$VERSION.exe" > "WinmatesSetup-$VERSION.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: winmates
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256

  release:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check the tag matches Cargo.toml
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Audio headers (voice messages)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --locked --release
      - run: cargo test --locked --release
      - name: Package
        run: |
          NAME="archmates-$VERSION-x86_64-linux"
          mkdir -p "dist/$NAME"
          cp target/release/archmates README.md LICENSE installer.sh "dist/$NAME/"
          cp -r packaging noctalia scripts widget "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - uses: actions/download-artifact@v4
        with:
          name: winmates
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/WinmatesSetup-*.exe dist/*.zip dist/*.tar.gz dist/*.sha256 \
            --title "archmates $GITHUB_REF_NAME" --generate-notes
