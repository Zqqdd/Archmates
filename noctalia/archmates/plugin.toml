# "Archmates" desktop widget: shows the state written by the archmates service
id = "archmates/archmates"
name = "Archmates"
version = "0.3.3"
plugin_api = 43
author = "archmates"
license = "MIT"
dependencies = []
tags = ["desktop", "social"]
icon = "users"
description = "Your CachyOS/Arch friends, peer to peer: who is online."

[[desktop_widget]]
id = "friends"
entry = "friends.luau"

# Opens when you click a friend in the widget: profile, RAM / storage, chat, files.
[[panel]]
id = "friend"
entry = "friend.luau"
width = 400
height = 560
placement = "floating"
position = "center"
