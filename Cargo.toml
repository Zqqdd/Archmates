[package]
name = "archmates"
version = "0.5.0"
edition = "2024"
default-run = "archmates"

[lib]
name = "archmates"
path = "src/lib.rs"

[[bin]]
name = "archmates"
path = "src/main.rs"

# Winmates: the Windows client (window: friends, chat, files, settings).
# Also runs on Linux as a desktop app: cargo build --release --features app
[[bin]]
name = "winmates"
path = "src/bin/winmates/main.rs"
required-features = ["app"]

# Background updater for Winmates: installed in AppData, started at every login.
[[bin]]
name = "winmates-updater"
path = "src/bin/winmates-updater.rs"
required-features = ["app"]

# WinmatesSetup.exe: the installer, with the programs embedded
# (build them first, then: WINMATES_PAYLOAD=target/release cargo build --release --features setup).
[[bin]]
name = "winmates-setup"
path = "src/bin/winmates-setup.rs"
required-features = ["setup"]

[features]
default = ["voice"]
app = ["dep:eframe", "dep:rfd", "dep:window-vibrancy", "dep:raw-window-handle"]
setup = ["dep:eframe", "dep:window-vibrancy", "dep:raw-window-handle"]
# Voice messages (microphone and speakers through cpal).
voice = ["dep:cpal"]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
iroh = "1.5.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.3"
getrandom = "0.4"
eframe = { version = "0.33", optional = true, features = ["persistence"] }
rfd = { version = "0.15", optional = true }
cpal = { version = "0.16", optional = true }
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
raw-window-handle = { version = "0.6", optional = true }
tauri-winrt-notification = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
window-vibrancy = { version = "0.6", optional = true }
