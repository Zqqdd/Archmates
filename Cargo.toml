[package]
name = "archmates"
version = "0.4.0"
edition = "2024"
default-run = "archmates"

[lib]
name = "archmates"
path = "src/lib.rs"

[[bin]]
name = "archmates"
path = "src/main.rs"

# Winmates: the Windows client (window: friends, chat, files, settings).
# Also runs on Linux as a desktop app: cargo build --release --features app
[[bin]]
name = "winmates"
path = "src/bin/winmates.rs"
required-features = ["app"]

[features]
app = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
iroh = "1.5.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.3"
getrandom = "0.4"
eframe = { version = "0.33", optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
] }
tauri-winrt-notification = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
